<!doctype html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mukta Kolhe | Computer Engineering &amp; AI Portfolio</title>
    <meta
      name="description"
      content="Personal portfolio of Mukta Kolhe — B.Tech Computer Engineering student at D.Y. Patil College of Engineering and Innovation, passionate about Artificial Intelligence, Web Development, and building impactful software solutions."
    />
    <meta
      name="keywords"
      content="Mukta Kolhe, Computer Engineering, Artificial Intelligence, Web Developer, Software Developer, B.Tech Portfolio, FinNews AI, CitySense AI, BudgetBuddy"
    />
    <meta name="author" content="Mukta Kolhe" />
    <meta property="og:title" content="Mukta Kolhe | Computer Engineering &amp; AI Portfolio" />
    <meta
      property="og:description"
      content="Explore the academic journey, technical skills, featured AI &amp; web projects, and hackathon experiences of Mukta Kolhe."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Custom MK Monogram SVG Favicon -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%236B123F'/%3E%3Cstop offset='50%25' stop-color='%239D174D'/%3E%3Cstop offset='100%25' stop-color='%23EC4899'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='%230B0610'/%3E%3Crect x='2' y='2' width='60' height='60' rx='14' fill='none' stroke='url(%23g)' stroke-width='3'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-weight='700' font-size='26' fill='%23F472B6'%3EMK%3C/text%3E%3C/svg%3E"
    />

    <!-- Google Fonts: Outfit (Display), Plus Jakarta Sans (Body), JetBrains Mono (Technical Numerals) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Prevent flash of wrong theme before React mounts -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('mk-portfolio-theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-[#FAF7F9] text-[#1D1119] dark:bg-[#08040C] dark:text-[#F6EEF4] antialiased selection:bg-[#EC4899]/30 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
